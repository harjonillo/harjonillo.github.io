<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #F7F7F3; }  /* porcelain */
    .fg { fill: #5C98FF; }  /* cornflower blue — light-mode accent */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #3E3A37; }
      .fg { fill: #A3C5FF; }  /* dark-mode accent, same hue lightened */
    }
  </style>
  <rect class="bg" width="64" height="64" rx="12"/>
  <text class="fg" x="32" y="43" font-family="'Recursive Variable', 'Recursive', ui-monospace, monospace" font-size="30" font-weight="600" text-anchor="middle">ha</text>
</svg>
